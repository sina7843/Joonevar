<script>
document.querySelectorAll('[data-indeterminate]').forEach(function (i) { i.indeterminate = true; });
var parent = document.querySelector('[data-parent] input');
var kids = Array.prototype.slice.call(document.querySelectorAll('input[name="facility"]'));
function sync() {
  var n = kids.filter(function (k) { return k.checked; }).length;
  parent.checked = n === kids.length; parent.indeterminate = n > 0 && n < kids.length;
  parent.setAttribute('aria-checked', parent.indeterminate ? 'mixed' : String(parent.checked));
}
parent.addEventListener('change', function () { kids.forEach(function (k) { k.checked = parent.checked; }); sync(); });
kids.forEach(function (k) { k.addEventListener('change', sync); });
</script>
