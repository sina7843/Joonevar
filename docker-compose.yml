# Local development and test database only. Not a deployment manifest.
services:
  db:
    image: postgres:16-alpine
    container_name: hamzist-db
    environment:
      POSTGRES_USER: hamzist
      POSTGRES_PASSWORD: hamzist_local_dev
      POSTGRES_DB: hamzist
    ports:
      - "5433:5432"
    volumes:
      - hamzist-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hamzist -d hamzist"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  hamzist-db-data:
